[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-reversing-lab"
version = "1.1.0"
description = "4-Tier (L1 -> L2 -> L3 -> L4) Static PE32+ x86_64 Reverse Engineering, Section Entropy, IAT Anti-Debug Triage & YARA Rule Studio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pe-reversing-lab = "pe_reversing_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
